<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ห้องทำงานครูโน้ต 🎮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2d2a4a; --gold:#ffcf5c; --gold-d:#f5a623;
    --card:rgba(255,255,255,.86); --shadow:0 10px 30px rgba(45,42,74,.18);
    --cow:#7cc4ff; --cat:#ff9eb5; --rabbit:#a0e7a0; --panda:#c9b3ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Mali',system-ui,sans-serif;color:var(--ink);
    overflow-x:hidden;background:#0e1430;
  }

  /* ===== STAGE: ห้องทำงาน 16:9 ===== */
  .stage{
    position:relative;width:100%;max-width:1600px;margin:0 auto;
    aspect-ratio:16/9;min-height:100vh;
    /* พื้นหลัง placeholder วาดด้วย CSS — จะถูกแทนด้วยรูป Canva ทีหลัง */
    background:
      radial-gradient(120% 80% at 50% -10%, #fff3d6 0%, transparent 55%),
      linear-gradient(180deg,#ffe9c7 0%,#ffd9a8 38%,#f6b27a 38%,#e89a63 100%);
    overflow:hidden;
  }
  /* ถ้ามีรูป assets/room.png จะใช้รูปแทน gradient */
  .stage.has-bg{background-image:url('assets/room.png');background-size:cover;background-position:center}
  /* มีรูปห้องจริงแล้ว -> ซ่อนของแต่งห้องที่วาดด้วย CSS */
  .stage.has-bg .deco{display:none}
  /* ของแต่งห้อง (placeholder) */
  .deco{position:absolute;opacity:.85;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
  .window{left:6%;top:10%;width:22%;height:34%;background:linear-gradient(180deg,#bfe9ff,#8fd0ff);border:10px solid #fff;border-radius:14px;box-shadow:inset 0 0 0 3px #cfa46a,var(--shadow)}
  .window::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 45%,rgba(255,255,255,.6) 50%,transparent 55%)}
  .plant{right:7%;top:18%;width:90px;height:120px;background:radial-gradient(circle at 50% 30%,#7fd17f,#3fa05a);border-radius:50% 50% 12px 12px}
  .plant::after{content:"";position:absolute;left:30%;bottom:-2px;width:40%;height:34px;background:#d98b5f;border-radius:6px}
  .desk{left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#caa06a,#a9824f)}

  /* ===== HEADER / โปรไฟล์ผู้เล่น ===== */
  .hud{
    position:absolute;left:3%;top:4%;z-index:6;
    display:flex;gap:14px;align-items:center;
    background:var(--card);backdrop-filter:blur(8px);
    padding:12px 18px;border-radius:18px;box-shadow:var(--shadow);
  }
  .avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;
    background:linear-gradient(135deg,var(--gold),var(--gold-d));box-shadow:0 4px 10px rgba(245,166,35,.5)}
  .hud-info h1{font-size:17px;font-weight:700;line-height:1.1}
  .hud-info .pmail{font-size:11px;color:#9a97b5;font-weight:600;margin-top:1px}
  .hud-info .lv{font-size:12px;color:#6b6890;font-weight:600;margin-top:3px}
  .xp{margin-top:5px;width:200px;height:12px;background:#eceaf6;border-radius:8px;overflow:hidden}
  .xp>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf5c,#f5a623);border-radius:8px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
  .topright{position:absolute;right:3%;top:4%;z-index:7;display:flex;gap:9px;align-items:center}
  .mbtn{width:42px;height:42px;border:0;border-radius:14px;cursor:pointer;font-size:19px;
    background:var(--card);backdrop-filter:blur(8px);box-shadow:var(--shadow);transition:transform .15s}
  .mbtn:hover{transform:scale(1.08)}
  .mbtn.on{background:linear-gradient(135deg,var(--gold),var(--gold-d))}
  .clock{background:var(--card);backdrop-filter:blur(8px);
    padding:10px 16px;border-radius:16px;box-shadow:var(--shadow);text-align:right}
  .clock .t{font-size:20px;font-weight:700;letter-spacing:1px}
  .clock .d{font-size:12px;color:#6b6890;font-weight:600}

  /* ===== บอร์ดกระดาษบนผนัง ===== */
  .board{position:absolute;z-index:4;left:50%;top:9.5%;transform:translateX(-50%) rotate(-1.3deg);
    width:clamp(232px,19vw,290px);background:#fffdf5;border-radius:6px;cursor:pointer;
    padding:12px 14px 14px;box-shadow:0 14px 26px rgba(45,42,74,.28),0 2px 0 #e8e2c8 inset;
    border:1px solid #efe9d2;transition:transform .2s}
  .board::before{content:"";position:absolute;inset:0;border-radius:6px;
    background:repeating-linear-gradient(transparent,transparent 27px,#f0ecd8 27px,#f0ecd8 28px);opacity:.5;pointer-events:none}
  .board:hover{transform:translateX(-50%) rotate(-1.3deg) translateY(-3px)}
  .board-pin{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff8aa0,#e23b6d);box-shadow:0 3px 5px rgba(0,0,0,.3)}
  .board-head{font-weight:700;font-size:13.5px;color:#5a4a2a;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
  .board-src{font-size:9px;font-weight:600;color:#9a9070}
  .board-body{display:flex;flex-direction:column;gap:5px}
  .bd-row{display:flex;align-items:center;gap:8px}
  .bd-d{flex:0 0 auto;width:30px;display:flex;flex-direction:column;align-items:center;line-height:1;
    color:#7a5af0}
  .bd-row.hol .bd-d{color:#e23b3b}
  .bd-d b{font-size:15px}.bd-d small{font-size:8px}
  .bd-t{flex:1;font-size:11.5px;color:#3a3550;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bd-t i{font-style:normal;color:#9a97b5;font-size:10px}
  .bd-row.today .bd-t{color:#e0922a;font-weight:700}
  .bd-row.today{background:#fff4d8;border-radius:5px;padding:2px 4px;margin:-2px -4px}
  .bd-empty{font-size:12px;color:#a59c7a;text-align:center;padding:8px 0}
  .bd-more{font-size:10px;color:#a59c7a;text-align:center;margin-top:2px}

  /* ===== ตัวละคร ===== */
  .char{position:absolute;z-index:5;cursor:pointer;width:clamp(110px,13vw,190px);
    transition:transform .25s ease;animation:float 3.2s ease-in-out infinite;text-align:center;
    /* เงาขอบรอบตัว ให้ตัวขาว (แพนด้า/แมว) เด้งออกจากพื้นหลังสีอ่อน */
    filter:drop-shadow(0 11px 13px rgba(0,0,0,.22)) drop-shadow(0 0 2px rgba(70,50,90,.45))}
  .char:nth-child(2){animation-delay:.4s}
  .char:nth-child(3){animation-delay:.8s}
  .char:nth-child(4){animation-delay:1.2s}
  .char:hover{transform:translateY(-10px) scale(1.05);animation-play-state:paused}
  .char .body{font-size:clamp(64px,8vw,110px);line-height:1;user-select:none}
  /* ถ้ามีไฟล์ PNG จะแสดงรูปแทน emoji */
  .char img{width:100%;display:none}
  .char.has-png .body{display:none}
  .char.has-png img{display:block}

  /* ป้ายชื่อ + การ์ดสถิติลอย */
  .tag{display:inline-block;margin-top:2px;padding:3px 12px;border-radius:999px;
    font-size:13px;font-weight:700;color:#fff;box-shadow:var(--shadow)}
  .bubble{position:absolute;bottom:78%;left:50%;transform:translateX(-50%);
    background:var(--card);backdrop-filter:blur(8px);padding:8px 14px;border-radius:14px;
    box-shadow:var(--shadow);white-space:nowrap;font-weight:700;font-size:14px;
    opacity:0;transition:.3s;pointer-events:none}
  .bubble::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    border:8px solid transparent;border-top-color:var(--card);border-bottom:0}
  .char:hover .bubble{opacity:1;bottom:84%}
  .mini{display:flex;gap:6px;justify-content:center;margin-top:6px}
  .mini b{font-size:11px;background:rgba(255,255,255,.9);padding:2px 8px;border-radius:8px;box-shadow:var(--shadow)}

  /* ตำแหน่งตัวละคร */
  #c-cow{left:8%;bottom:20%}
  #c-cat{left:32%;bottom:14%}
  #c-rabbit{right:30%;bottom:16%}
  #c-panda{right:7%;bottom:21%}
  #c-cow .tag{background:var(--cow)} #c-cat .tag{background:var(--cat)}
  #c-rabbit .tag{background:var(--rabbit);color:#1c5a1c} #c-panda .tag{background:var(--panda)}

  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  /* ไฟ LIVE เมื่อต่อข้อมูลจริงสำเร็จ */
  .char.live .tag::after{content:"●";margin-left:5px;color:#27d367;font-size:9px;vertical-align:middle;
    animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ===== PANEL รายละเอียด (เปิดเมื่อคลิกตัวละคร) ===== */
  .scrim{position:fixed;inset:0;background:rgba(20,16,40,.5);backdrop-filter:blur(3px);
    z-index:20;opacity:0;pointer-events:none;transition:.25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .panel{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);
    width:min(92vw,460px);max-height:84vh;overflow:auto;background:#fff;border-radius:24px;
    box-shadow:0 30px 60px rgba(20,16,40,.4);opacity:0;pointer-events:none;transition:.3s}
  .panel.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .panel .head{padding:22px 24px;color:#fff;display:flex;align-items:center;gap:14px}
  .panel .head .ic{font-size:46px}
  .panel .head h2{font-size:20px}
  .panel .head p{font-size:13px;opacity:.9;font-weight:500}
  .panel .x{position:absolute;right:16px;top:16px;width:34px;height:34px;border:0;border-radius:50%;
    background:rgba(255,255,255,.25);color:#fff;font-size:18px;cursor:pointer}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid #f0eef7}
  .stat-row .lbl{font-weight:600;color:#4a4770}
  .stat-row .val{font-weight:700;font-size:18px;color:var(--ink)}
  .bar{height:10px;background:#eceaf6;border-radius:6px;overflow:hidden;margin:0 24px 14px}
  .bar>i{display:block;height:100%;border-radius:6px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;padding:16px 24px}
  .badge{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:#fff7e3;color:#b9821a;border:1.5px solid #ffe2a3}
  .quote{padding:16px 24px;font-size:14px;color:#6b6890;background:#faf9ff;font-weight:600}
  .sec-h{padding:16px 24px 8px;font-size:14px;font-weight:700;color:#4a4770}
  .sec-h small{font-weight:500;color:#9a97b5;font-size:11px}
  /* ตารางวันนี้ */
  .tt{padding:0 16px 6px}
  .tt-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px}
  .tt-row:nth-child(odd){background:#f7f6fd}
  .tt-row.done{background:#eafaf0}
  .tt-row .pd{flex:0 0 auto;font-size:11px;font-weight:700;color:#fff;background:#7cc4ff;padding:4px 8px;border-radius:8px}
  .tt-main{flex:1;display:flex;flex-direction:column;line-height:1.25}
  .tt-main b{font-size:13.5px;color:#2d2a4a}
  .tt-main small{font-size:11px;color:#8b88a8}
  .tt-st{flex:0 0 auto;font-size:11px;font-weight:700;color:#27a05a}
  /* สรุปรายวิชา */
  .subj{padding:0 24px 8px}
  .subj-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #eceaf6}
  .subj-row:last-child{border-bottom:0}
  .subj-n{font-size:13px;font-weight:600;color:#4a4770}
  .subj-v{font-size:13px;color:#2d2a4a;white-space:nowrap}
  .subj-v small{color:#a7a4c0;font-size:11px;font-weight:500}
  /* รายการโปรเจกต์ */
  .proj{padding:0 16px 6px}
  .proj-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px}
  .proj-row:nth-child(odd){background:#f7f6fd}
  .proj-ic{flex:0 0 auto;font-size:20px}
  .proj-n{flex:1;font-size:13px;font-weight:700;color:#2d2a4a;display:flex;flex-direction:column;line-height:1.3}
  .proj-n small{font-weight:500;font-size:11px;color:#e0922a}
  .proj-go{flex:0 0 auto;font-size:11px;font-weight:700;text-decoration:none;color:#fff;
    background:#ff9eb5;padding:4px 10px;border-radius:8px}
  .proj-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .proj-dot.ok{background:#27d367}.proj-dot.warn{background:#f5a623}
  /* งานค้าง */
  .todos{padding:0 24px 6px}
  .todo-it{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #eceaf6}
  .todo-it:last-child{border-bottom:0}
  .td-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:#9a97b5}
  .todo-it.high .td-dot{background:#ef4444}.todo-it.medium .td-dot{background:#f5a623}.todo-it.low .td-dot{background:#3b82f6}
  .td-tx{font-size:12.5px;color:#4a4770;line-height:1.4}
  .td-tx b{color:#2d2a4a}
  .td-tx small{color:#a7a4c0;font-size:11px}
  .todo-it.is-done .td-tx{color:#a7a4c0}
  .todo-it.is-done .td-dot{background:#27d367!important}
  /* ปฏิทิน */
  .cal{padding:0 16px 6px}
  .cal-row{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:12px;text-decoration:none}
  .cal-row:nth-child(odd){background:#f7f6fd}
  .cal-d{flex:0 0 auto;width:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:10px;padding:5px 0;background:#efeafc;color:#7a5af0;line-height:1.1}
  .cal-d.holiday{background:#ffe6e6;color:#e23b3b}
  .cal-d b{font-size:16px}.cal-d small{font-size:9px}
  .cal-main{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}
  .cal-main b{font-size:13px;color:#2d2a4a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-main small{font-size:11px;color:#8b88a8}
  .cal-go{flex:0 0 auto;color:#a89cff;font-weight:700}
  /* ปฏิทินเดือน (กริด 7 วัน) */
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:4px 18px 12px}
  .mg-h{text-align:center;font-size:10px;font-weight:700;color:#9a97b5;padding:2px 0}
  .mg-c{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:9px;background:#f5f4fb;font-size:12.5px;font-weight:600;color:#6a6790}
  .mg-c.blank{background:transparent}
  .mg-c.has{background:#e9e3fb;color:#5a4ad0;font-weight:700}
  .mg-c.hol{background:#ffe6e6;color:#e23b3b}
  .mg-c.today{outline:2px solid var(--gold-d);background:#fff4d8;color:#e0922a}
  .mg-dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#7a5af0}
  .mg-c.hol .mg-dot{background:#e23b3b}
  .mg-c.today .mg-dot{background:var(--gold-d)}
  .mg-cap{padding:2px 24px 10px;font-size:11px;color:#9a97b5}
  .mg-cap b{color:#7a5af0}
  /* ปุ่มลิงก์ */
  .acts{display:flex;gap:10px;padding:14px 24px 4px}
  .act:nth-child(3){background:linear-gradient(135deg,#a0e7a0,#5cc97a);box-shadow:0 6px 14px rgba(92,201,122,.35)}
  .act{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:13.5px;
    padding:12px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#7cc4ff,#4aa3f0);
    box-shadow:0 6px 14px rgba(74,163,240,.35);transition:transform .15s}
  .act:nth-child(2){background:linear-gradient(135deg,#ffcf5c,#f5a623);box-shadow:0 6px 14px rgba(245,166,35,.35)}
  .act:active{transform:scale(.97)}

  .footer{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);z-index:6;
    font-size:11px;color:rgba(45,42,74,.55);font-weight:600;pointer-events:none}

  /* ===== ติ๊กเกอร์ NAV กบข. ===== */
  .ticker{position:absolute;left:0;right:0;bottom:22px;z-index:6;display:flex;align-items:center;gap:0;
    background:rgba(28,24,54,.82);backdrop-filter:blur(6px);height:32px;cursor:pointer;overflow:hidden}
  .ticker-tag{flex:0 0 auto;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#3a2d00;
    font-weight:800;font-size:12px;padding:0 12px;height:100%;display:flex;align-items:center;z-index:2;
    box-shadow:6px 0 12px rgba(0,0,0,.25)}
  .ticker-win{flex:1;overflow:hidden;position:relative;height:100%}
  .ticker-track{position:absolute;white-space:nowrap;height:100%;display:flex;align-items:center;
    font-size:12px;font-weight:600;color:#fef9ec;animation:scrollx 40s linear infinite;will-change:transform}
  .ticker:hover .ticker-track{animation-play-state:paused}
  .tk-item{padding:0 18px;display:inline-flex;gap:6px;align-items:center}
  .tk-item b{color:#fff}
  .tk-up{color:#5cf08a}.tk-dn{color:#ff7a8f}.tk-eq{color:#b9b4d6}
  .tk-sep{color:#5a5480}
  @keyframes scrollx{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  /* กล่องคำพูดอัตโนมัติ (สลับกันพูด) */
  .char.say .bubble{opacity:1;bottom:86%}

  /* ===== แถบมือถือ (ซ่อนบน desktop) ===== */
  .mwrap{display:none;flex-direction:column;gap:12px;padding:14px;background:#0e1430;flex:1}
  .mcal{background:#161d44;border:1px solid #2b376b;border-radius:16px;padding:12px 14px}
  .mcal-h{font-size:13px;font-weight:700;color:#cfd6ff;margin-bottom:8px;display:flex;justify-content:space-between}
  .mcal-h .board-src{color:#8a93c8}
  .mcal .bd-row{gap:9px;padding:5px 0}
  .mcal .bd-d{width:34px;color:#a89cff}.mcal .bd-row.hol .bd-d{color:#ff8a8a}
  .mcal .bd-d b{font-size:15px}.mcal .bd-t{color:#dfe3ff;font-size:12.5px}
  .mcal .bd-row.today{background:#2a2150;border-radius:6px;padding:3px 6px;margin:0 -6px}
  .mcal .bd-row.today .bd-t{color:#ffcf5c}
  .mcal .bd-empty{color:#8a93c8}
  .mnav{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .mnav-b{display:flex;align-items:center;gap:10px;background:#1b2350;border:1px solid #2b376b;border-radius:14px;
    padding:13px 14px;color:#e6e9ff;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;text-align:left}
  .mnav-b .mi{font-size:26px}
  .mnav-b small{display:block;font-weight:500;color:#9aa3d6;font-size:11px;margin-top:1px}

  @media(max-width:680px){
    body{padding:0;display:flex;flex-direction:column;min-height:100vh}
    /* คงสัดส่วน 16:9 ฉากห้องไม่ให้ซูมเพี้ยน + จัดฉากไว้บน */
    .stage{aspect-ratio:16/9;min-height:auto;width:100%;flex:0 0 auto}
    .char{width:52px}                        /* ตัวเล็กลงให้พอดีฉาก 16:9 */
    .char .body{font-size:38px}
    .char .tag{font-size:8px;padding:2px 6px}
    .mini,.bubble,.board{display:none}       /* มือถือ: ซ่อนบอร์ดผนัง+สถิติย่อ ใช้แตะ/การ์ดล่างแทน */
    .hud{padding:6px 9px;gap:7px}.avatar{width:34px;height:34px;font-size:20px}
    .hud-info h1{font-size:12px}.hud-info .pmail{font-size:8px}.hud-info .lv{font-size:9px}
    .xp{width:108px;height:9px}

// โหลดชีตเป็น array ของ object (key = ชื่อคอลัมน์แถวแรก) — ระบุชื่อชีตได้
function gviz(sheetId,sheetName){
  return new Promise((resolve,reject)=>{
    const cb='gviz_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const to=setTimeout(()=>{cleanup();reject('timeout');},12000);
    function cleanup(){clearTimeout(to);delete window[cb];s.remove();}
    window[cb]=(resp)=>{
      try{
        const t=resp.table, cols=t.cols.map(c=>(c.label||c.id||'').trim());
        const rows=t.rows.map(r=>{const o={};(r.c||[]).forEach((cell,i)=>{o[cols[i]]=cell?cell.v:null;});return o;});
        cleanup();resolve(rows);
      }catch(err){cleanup();reject(err);}
    };
    s.onerror=()=>{cleanup();reject('script error');};
    let src=`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${cb};out:json&headers=1`;
    if(sheetName) src+='&sheet='+encodeURIComponent(sheetName);
    s.src=src;
    document.body.appendChild(s);
  });
}

function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function asDateStr(v){
  if(v==null) return '';
  if(v instanceof Date) return fmtDate(v);
  const s=String(v);
  const m=s.match(/^Date\((\d+),(\d+),(\d+)/);   // gviz date type
  if(m) return fmtDate(new Date(+m[1],+m[2],+m[3]));
  return s.slice(0,10);
}
function mondayOf(d){const x=new Date(d);const dow=x.getDay();x.setDate(x.getDate()+(dow===0?-6:1-dow));x.setHours(0,0,0,0);return x;}
// gviz เก็บเวลาเป็น Date(1899,11,30,HH,MM,SS) -> แปลงเป็น "HH:MM"
function asTimeStr(v){
  if(v==null) return '';
  const s=String(v);
  let m=s.match(/^Date\(\d+,\d+,\d+,(\d+),(\d+)/);
  if(m) return m[1].padStart(2,'0')+':'+m[2].padStart(2,'0');
  m=s.match(/(\d{1,2}):(\d{2})/);
  if(m) return m[1].padStart(2,'0')+':'+m[2];
  return s;
}

// คำนวณการ์ด 🐮 งานสอน + XP จาก Schedule + TeachingLog + Subjects
function computeTeaching(schedule,logs,subjects){
  const now=new Date(), todayStr=fmtDate(now);
  const schedDow=(now.getDay()===0?7:now.getDay());   // 1=จ..7=อา
  const monday=mondayOf(now), ym=todayStr.slice(0,7);

  // map subject_id -> {name, level}
  const subjMap={};
  subjects.forEach(r=>{subjMap[String(r.subject_id).trim()]={name:r.subject_name,level:r.level};});
  const subjLabel=sid=>{const s=subjMap[sid];return s?(s.name+(s.level?' '+s.level:'')):sid;};
  const className=cid=>CLASS_MAP[cid]||cid;

  const sched=schedule.filter(r=>String(r.teacher_id).trim()===CFG.teacherId && String(r.is_active).toUpperCase()==='TRUE');
  const weekScheduled=sched.length;
  const todaySched=sched.filter(r=>Number(r.day_of_week)===schedDow)
                        .sort((a,b)=>Number(a.period)-Number(b.period));
  const todayScheduled=todaySched.length;

  // index Schedule: class|dow|period -> subject_id (ไว้ join กับ log)
  const schedIdx={};
  sched.forEach(r=>{schedIdx[String(r.class_id).trim()+'|'+Number(r.day_of_week)+'|'+Number(r.period)]=String(r.subject_id).trim();});

  const mine=logs.filter(r=>String(r.teacher_id).trim()===CFG.teacherId);
  const todayLogs=mine.filter(r=>asDateStr(r.date)===todayStr);
  const todayTaught=todayLogs.filter(r=>r.status==='taught').length;
  const todayRecorded=todayLogs.length;

  // สถานะที่บันทึกของแต่ละคาบวันนี้ (ไว้โชว์ในตาราง)
  const todayStatus={};
  todayLogs.forEach(r=>{todayStatus[String(r.class_id).trim()+'|'+Number(r.period)]=r.status;});

  let weekTaught=0,monthRecorded=0,totalTaught=0;
  const bySubjCount={};                              // subject_id -> คาบที่สอนแล้ว (ตั้งแต่เปิดเทอม)
  mine.forEach(r=>{
    const ds=asDateStr(r.date); if(!ds) return;
    const d=new Date(ds+'T00:00:00');
    if(r.status==='taught'){
      totalTaught++; if(d>=monday) weekTaught++;
      if(ds>=CFG.termStart){
        const dow=(d.getDay()===0?7:d.getDay());
        const sid=schedIdx[String(r.class_id).trim()+'|'+dow+'|'+Number(r.period)];
        if(sid) bySubjCount[sid]=(bySubjCount[sid]||0)+1;
      }
    }
    if(ds.slice(0,7)===ym) monthRecorded++;
  });
  const recordPct=todayScheduled?Math.round(todayRecorded/todayScheduled*100):0;

  // ตารางวันนี้ (วิชา/คาบ/เวลา/ห้อง/สถานะ)
  const ST_TH={taught:'✓ สอนแล้ว',sick:'ลาป่วย',personal:'ลากิจ',training:'อบรม',substitute:'มีครูแทน',activity:'กิจกรรม',no_class:'ไม่มีสอน'};
  const today=todaySched.map(r=>{
    const cid=String(r.class_id).trim(), p=Number(r.period);
    const st=todayStatus[cid+'|'+p];
    return {period:p,time:asTimeStr(r.start_time)+'–'+asTimeStr(r.end_time),
            subject:subjLabel(String(r.subject_id).trim()),cls:className(cid),
            status:st?ST_TH[st]||st:''};
  });

  // สรุปสอนสะสมรายวิชา (วิชาที่สอนทั้งหมด + จำนวนคาบที่สอนแล้ว) เรียงมาก→น้อย
  const distinctSubj={};
  sched.forEach(r=>{const sid=String(r.subject_id).trim();distinctSubj[sid]=(distinctSubj[sid]||0)+1;});
  const bySubject=Object.keys(distinctSubj).map(sid=>({
    label:subjLabel(sid),taught:bySubjCount[sid]||0,perWeek:distinctSubj[sid]
  })).sort((a,b)=>b.taught-a.taught || b.perWeek-a.perWeek);

  let bubble;
  if(todayScheduled===0) bubble='วันนี้ไม่มีคาบสอน พักได้~';
  else if(todayRecorded>=todayScheduled) bubble='บันทึกครบทุกคาบแล้ว เก่งมาก!';
  else if(todayTaught>0) bubble='วันนี้สอนแล้ว '+todayTaught+' คาบ!';
  else bubble='วันนี้มี '+todayScheduled+' คาบ อย่าลืมบันทึกนะ';

  const badges=[];
  if(weekScheduled) badges.push('📚 '+weekScheduled+' คาบ/สัปดาห์');
  if(totalTaught>0) badges.push('🎓 สอนสะสม '+totalTaught+' คาบ');
  if(weekTaught>=10) badges.push('🔥 สัปดาห์นี้ '+weekTaught+' คาบ');
  if(recordPct===100&&todayScheduled) badges.push('✅ บันทึกครบวันนี้');
  if(!badges.length) badges.push('🌱 เริ่มบันทึกการสอนกันเถอะ');

  return {
    card:{title:'งานสอน',subtitle:'วันนี้วัน'+DOW_TH[schedDow]+' · '+todayScheduled+' คาบ',
      bubble,color:'#7cc4ff',
      stats:[['คาบที่สอนวันนี้',todayTaught+' / '+todayScheduled],
             ['สัปดาห์นี้ (สอนแล้ว)',weekTaught+' คาบ'],
             ['สอนสะสมทั้งเทอม',totalTaught+' คาบ'],
             ['บันทึกครบวันนี้',recordPct+'%']],
      progress:recordPct,badges,
      today,bySubject,
      links:[{label:'📝 บันทึกการสอน',url:CFG.logUrl},{label:'📅 ดูตารางสอน',url:CFG.scheduleUrl}],
      quote:todayScheduled?'ขยันสอนสุดๆ เลยครู ไปต่ออีกนิดเดียว!':'วันว่างก็พักผ่อนบ้างนะครู ☕'},
    xp:totalTaught*10,
    summary:{todayScheduled,todayRecorded,todayPending:Math.max(0,todayScheduled-todayRecorded)}
  };
}

// 🐱 คำนวณการ์ดเว็บ/โปรเจกต์ จาก DASH_API (apps + todos)
function computeProjects(d){
  const apps=(d.apps||[]).filter(a=>a.category!=='hub');
  const total=apps.length;
  const isOk=s=>(s==='active'||!['pending','checking'].includes(s)); // ค่าแปลกๆ ถือว่า active
  // กรอง warning ที่เป็นแค่ keyword สถานะ (ข้อมูลคอลัมน์เลื่อนในชีตต้นทาง) ออก
  const cleanWarn=w=>{w=(w||'').trim();return (['active','pending','checking'].includes(w.toLowerCase())||w.length<4)?'':w;};
  const active=apps.filter(a=>isOk(a.status)).length;
  const warnApps=apps.filter(a=>cleanWarn(a.warning));
  const done=v=>['true','done','yes','1'].includes(String(v).trim().toLowerCase());
  const openTodos=(d.todos||[]).filter(t=>t.text&&!done(t.done));
  const pct=total?Math.round(active/total*100):0;

  const projects=apps.map(a=>({
    icon:a.icon||'🔹',name:a.name,ok:isOk(a.status),
    url:a.site_url||a.sheet1_url||'',warning:cleanWarn(a.warning)
  }));
  const rank={high:0,medium:1,low:2};
  const todos=openTodos.slice().sort((a,b)=>(rank[a.priority]??3)-(rank[b.priority]??3))

// 🐰 คำนวณการ์ดงานนักเรียน จาก StudentProfiles + HealthCheck + HomeVisit + GoodDeeds
function computeStudents(profiles,health,visits,deeds){
  const today=fmtDate(new Date()), T=CFG.teacherId;
  const cls=cid=>CLASS_MAP[cid]||cid||'';
  const distinct=(arr,k)=>new Set(arr.filter(r=>r[k]!=null&&String(r[k]).trim()).map(r=>String(r[k]).trim())).size;

  const totalProfiles=distinct(profiles,'student_id');
  const myHealth=health.filter(r=>String(r.teacher_id).trim()===T);
  const healthToday=myHealth.filter(r=>asDateStr(r.date)===today);
  const healthTodayStu=new Set(healthToday.map(r=>String(r.student_id).trim())).size;
  const myVisits=visits.filter(r=>String(r.teacher_id).trim()===T && asDateStr(r.visit_date)>=CFG.termStart);
  const visitedStu=new Set(myVisits.map(r=>String(r.student_id).trim())).size;
  const myDeeds=deeds.filter(r=>String(r.teacher_id).trim()===T);
  const deedPts=myDeeds.reduce((s,r)=>s+(Number(r.points)||0),0);
  const coverage=totalProfiles?Math.round(visitedStu/totalProfiles*100):0;

  // ตรวจสุขภาพวันนี้ (รายคน)
  const healthList=healthToday.map(r=>({stu:String(r.student_id).trim(),cls:cls(r.class_id),
    items:[['ผม',r.hair],['เล็บ',r.nails],['ฟัน',r.teeth],['แต่งกาย',r.uniform]]}));
  // ความดีล่าสุด
  const goodDeeds=myDeeds.slice().sort((a,b)=>asDateStr(b.date).localeCompare(asDateStr(a.date)))
    .slice(0,6).map(r=>({date:asDateStr(r.date),desc:r.description||r.category||'',
      pts:Number(r.points)||0,cls:cls(r.class_id)}));

  const badges=[];
  if(totalProfiles) badges.push('👤 '+totalProfiles+' โปรไฟล์');
  if(visitedStu) badges.push('🏠 เยี่ยมบ้าน '+visitedStu+' คน');
  if(deedPts) badges.push('⭐ ความดี '+deedPts+' แต้ม');
  if(myHealth.length) badges.push('🩺 ตรวจสุขภาพ '+myHealth.length+' ครั้ง');
  if(!badges.length) badges.push('🌱 เริ่มบันทึกข้อมูลนักเรียน');

  let bubble;
  if(healthTodayStu>0) bubble='วันนี้ตรวจสุขภาพแล้ว '+healthTodayStu+' คน!';
  else if(visitedStu>0) bubble='เยี่ยมบ้านไปแล้ว '+visitedStu+' คน เก่งมาก!';
  else bubble='มาดูแลน้องๆ กันเถอะ 🐰';

  return {
    card:{title:'งานนักเรียน',subtitle:'เยี่ยมบ้าน '+coverage+'% ('+visitedStu+'/'+totalProfiles+' คน)',
      color:'#a0e7a0',bubble,
      stats:[['นักเรียนมีโปรไฟล์',totalProfiles+' คน'],
             ['ตรวจสุขภาพวันนี้',healthTodayStu+' คน'],
             ['เยี่ยมบ้านสะสม',visitedStu+' คน'],
             ['บันทึกความดี',myDeeds.length+' ครั้ง ('+deedPts+' แต้ม)']],
      progress:coverage,badges,
      healthToday:healthList,goodDeeds,
      links:[{label:'👧 เปิดระบบนักเรียน',url:CFG.studentUrl}],
      quote:visitedStu<totalProfiles?'เยี่ยมบ้านให้ครบทุกคนนะ น้องๆ รออยู่ 🏠':'ดูแลน้องๆ ครบทุกคนเลย เยี่ยมมาก!'},
    xp:myDeeds.length*5+myVisits.length*10+myHealth.length*2,
    summary:{totalProfiles,visitedStu,pendingVisits:Math.max(0,totalProfiles-visitedStu),healthTodayStu}
  };
}

// บอร์ดกระดาษบนผนัง — โชว์ปฏิทินสัปดาห์นี้ (สด)
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MON_FULL=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];

// สร้างกริดปฏิทินเดือนปัจจุบัน (7 วัน x สัปดาห์) จาก event ทั้งเดือน
function buildMonthCalendar(events){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), todayStr=fmtDate(now);
  const mk=todayStr.slice(0,7);
  const map={};                                     // 'YYYY-MM-DD' -> {events:[], holiday}
  (events||[]).forEach(ev=>{
    const ds=asDateStr(ev.date); if(!ds||ds.slice(0,7)!==mk) return;
    if(!map[ds]) map[ds]={events:[],holiday:false};
    map[ds].events.push({title:ev.title||'',
      time:String(ev.all_day).toUpperCase()==='TRUE'?'':asTimeStr(ev.time),
      link:ev.link||'',kind:ev.kind||'work'});
    if((ev.kind||'')==='holiday') map[ds].holiday=true;
  });
  const startDow=new Date(y,m,1).getDay();          // 0=อา
  const daysInMonth=new Date(y,m+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push({blank:true});
  let eventDays=0;
  for(let d=1;d<=daysInMonth;d++){
    const ds=fmtDate(new Date(y,m,d));
    const info=map[ds]||{events:[],holiday:false};
    if(info.events.length) eventDays++;
    cells.push({day:d,date:ds,events:info.events,holiday:info.holiday,today:ds===todayStr});
  }
  return {title:TH_MON_FULL[m]+' '+(y+543),cells,eventDays};
}
function renderBoard(cal){
  const today=fmtDate(new Date());
  const wk=(cal&&cal.week)||[];
  const srcTxt=CAL_SOURCE==='live'?'🟢 สด':(CAL_SOURCE==='sheet'?'📄 sync':'');
  ['boardSrc','mCalSrc'].forEach(id=>{const s=document.getElementById(id);if(s)s.textContent=srcTxt;});
  let inner;
  if(!wk.length){ inner='<div class="bd-empty">ไม่มีนัดสัปดาห์นี้ 🎉</div>'; }
  else inner=wk.slice(0,5).map(e=>{
    const d=new Date(e.date+'T00:00:00');
    const isToday=e.date===today;
    return `<div class="bd-row${isToday?' today':''}${e.kind==='holiday'?' hol':''}">
      <span class="bd-d"><b>${d.getDate()}</b><small>${TH_DOW[d.getDay()]}</small></span>
      <span class="bd-t">${e.title}${e.time?` <i>${e.time}</i>`:''}</span></div>`;
  }).join('')+(wk.length>5?`<div class="bd-more">+${wk.length-5} เพิ่มเติม…</div>`:'');
  ['boardBody','mCalBody'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=inner;});
}

// จัดกลุ่ม event ปฏิทินที่ยังไม่ผ่าน → สัปดาห์นี้ / เดือนนี้ / ถัดไป
function groupCalendar(events){
  const today=fmtDate(new Date());
  const in7=new Date();in7.setDate(in7.getDate()+7);const in7s=fmtDate(in7);
  const mk=today.slice(0,7);
  const week=[],month=[],later=[];
  (events||[]).map(e=>({date:asDateStr(e.date),time:e.all_day&&String(e.all_day).toUpperCase()==='TRUE'?'':asTimeStr(e.time),
      title:e.title,allDay:String(e.all_day).toUpperCase()==='TRUE',kind:e.kind||'work',link:e.link||''}))
    .filter(e=>e.date && e.date>=today)
    .sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''))
    .forEach(e=>{
      if(e.date<=in7s) week.push(e);
      else if(e.date.slice(0,7)===mk) month.push(e);
      else later.push(e);
    });
  return {week,month,later};
}

// 🐼 คำนวณการ์ดงานส่วนตัว = A) ชีต To-do ส่วนตัว + B) auto-digest + 📅 ปฏิทิน
function computePersonal(todos,ctx,calEvents){
  const today=fmtDate(new Date());
  const done=v=>['true','done','yes','1','เสร็จ'].includes(String(v).trim().toLowerCase());
  const items=todos.filter(t=>t.task&&String(t.task).trim());
  const open=items.filter(t=>!done(t.done));
  const doneCnt=items.length-open.length;
  const rank={high:0,medium:1,low:2};
  const personal=items.slice().sort((a,b)=>
      (done(a.done)?1:0)-(done(b.done)?1:0) || (rank[a.priority]??3)-(rank[b.priority]??3))
    .map(t=>({priority:(t.priority||'low'),text:t.task,done:done(t.done),
      due:t.due_date?asDateStr(t.due_date):'',note:t.note||''}));

  // B) auto-digest จากหมวดอื่น
  const auto=[];
  if(ctx.teach&&ctx.teach.todayPending>0)
    auto.push({icon:'📝',text:'บันทึกการสอนวันนี้อีก '+ctx.teach.todayPending+' คาบ',url:CFG.logUrl});
  if(ctx.student&&ctx.student.pendingVisits>0)
    auto.push({icon:'🏠',text:'เยี่ยมบ้านยังไม่ครบ — เหลือ '+ctx.student.pendingVisits+' คน',url:CFG.studentUrl});
  if(ctx.student&&ctx.student.healthTodayStu===0)
    auto.push({icon:'🩺',text:'วันนี้ยังไม่ได้ตรวจสุขภาพนักเรียน',url:CFG.studentUrl});
  (ctx.proj&&ctx.proj.highTodos||[]).forEach(t=>
    auto.push({icon:'🔴',text:(t.app?t.app+': ':'')+t.text,url:CFG.todosSheetUrl}));

  // ปฏิทิน: จัดกลุ่ม + เอา event "วันนี้" (ที่เป็นงาน) ใส่ auto-digest
  const cal=groupCalendar(calEvents);
  const monthCal=buildMonthCalendar(calEvents);     // กริดปฏิทินทั้งเดือน
  cal.week.filter(e=>e.date===today&&e.kind!=='holiday').forEach(e=>
    auto.push({icon:'📅',text:'วันนี้: '+e.title+(e.time?' ('+e.time+' น.)':''),url:e.link}));

  const totalToday=open.length+auto.length;
  const pct=items.length?Math.round(doneCnt/items.length*100):(auto.length?0:100);

  const badges=[];
  if(open.length) badges.push('📝 ค้าง '+open.length+' งาน');
  if(doneCnt) badges.push('✅ เสร็จ '+doneCnt+' งาน');
  if(cal.week.length) badges.push('📅 สัปดาห์นี้ '+cal.week.length+' นัด');
  if(auto.length) badges.push('🔔 เตือน '+auto.length+' รายการ');
  if(!badges.length) badges.push('🎉 วันนี้เคลียร์หมดแล้ว');

  let bubble;
  if(totalToday===0) bubble='วันนี้ไม่มีงานค้าง พักผ่อนได้เลย 🎍';
  else if(auto.length) bubble='มีงานเตือน '+auto.length+' + ส่วนตัว '+open.length+' รายการ';
  else bubble='งานส่วนตัวค้าง '+open.length+' รายการ';

  return {
    card:{title:'งานส่วนตัว',subtitle:'วันนี้ '+totalToday+' รายการ · เสร็จ '+doneCnt,
      color:'#c9b3ff',bubble,
      stats:[['งานส่วนตัว (ค้าง)',open.length+' / '+items.length],
             ['เสร็จแล้ว',doneCnt+' รายการ'],
             ['เตือนจากระบบ',auto.length+' รายการ'],
             ['รวมต้องทำวันนี้',totalToday+' รายการ']],
      progress:pct,badges,personal,autoItems:auto,calendar:cal,monthCal,
      links:[{label:'✏️ แก้งานส่วนตัว',url:CFG.personalUrl},{label:'📅 เปิดปฏิทิน',url:CFG.calendarUrl}],
      quote:totalToday?'ค่อยๆ ทำทีละอย่างนะ พักได้ก็พัก เดี๋ยวก็เสร็จเอง 🐼':'เยี่ยมมาก! เคลียร์งานวันนี้หมดแล้ว พักผ่อนเลย 🎍'},
    xp:doneCnt*5
  };
}

/* ===== 🎵 เพลงประกอบ (มี bgm.mp3 ใช้ไฟล์ ไม่มีก็สังเคราะห์เสียงกล่องดนตรี) ===== */
let actx,musicOn=false,mTimer,useSynth=false;
const PENTA=[523.25,587.33,659.25,783.99,880.0,1046.5];
function setMBtn(){const b=document.getElementById('musicBtn');if(!b)return;b.textContent=musicOn?'🎵':'🔈';b.classList.toggle('on',musicOn);}
function synthNote(f,t,d,g){const o=actx.createOscillator(),ga=actx.createGain();o.type='sine';o.frequency.value=f;o.connect(ga);ga.connect(actx.destination);ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(g,t+0.03);ga.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d);}
function synthTick(){if(!musicOn||!useSynth)return;const t=actx.currentTime;const f=PENTA[Math.floor(Math.random()*PENTA.length)];synthNote(f,t,1.9,0.10);if(Math.random()<0.35)synthNote(f/2,t,2.4,0.05);mTimer=setTimeout(synthTick,850+Math.random()*800);}
function toggleMusic(){
  musicOn=!musicOn;setMBtn();
  if(musicOn){
    const bgm=document.getElementById('bgm');bgm.volume=0.45;
    bgm.play().then(()=>{useSynth=false;}).catch(()=>{          // ไม่มีไฟล์/เล่นไม่ได้ → กล่องดนตรีสังเคราะห์
      useSynth=true;if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();actx.resume();synthTick();
    });
  }else{ try{document.getElementById('bgm').pause();}catch(e){} useSynth=false;clearTimeout(mTimer); }
}

/* ===== 💬 กล่องคำพูดอัตโนมัติ (สลับกันพูดตามข้อมูลจริง) ===== */
let SPEECH={},spIdx=0,spStarted=false;
function buildSpeech(){
  const s={cow:[],cat:[],rabbit:[],panda:[]};
  const C=DATA.cow;if(C){if(C.today&&C.today.length){const n=C.today[0];s.cow.push('เช้านี้มีสอน คาบ '+n.period+' '+n.subject+'!');}s.cow.push(C.bubble);}
  const K=DATA.cat;if(K){s.cat.push(K.bubble);if(K.todos&&K.todos[0])s.cat.push('อย่าลืม: '+K.todos[0].text);}
  const R=DATA.rabbit;if(R){s.rabbit.push(R.bubble);}
  const P=DATA.panda;if(P){s.panda.push(P.bubble);if(P.calendar&&P.calendar.week)P.calendar.week.filter(e=>e.kind!=='holiday').slice(0,2).forEach(e=>s.panda.push('อย่าลืม: '+e.title+(e.time?' '+e.time+' น.':'')));}
  Object.keys(s).forEach(k=>s[k]=s[k].filter(Boolean));
  SPEECH=s;
  if(!spStarted){spStarted=true;setTimeout(rotateSpeech,1800);setInterval(rotateSpeech,5600);}
}
function rotateSpeech(){
  if(window.matchMedia&&window.matchMedia('(max-width:680px)').matches)return;  // มือถือใช้การ์ดแทน
  const order=['cow','cat','rabbit','panda'].filter(k=>SPEECH[k]&&SPEECH[k].length);
  if(!order.length)return;
  document.querySelectorAll('.char.say').forEach(c=>c.classList.remove('say'));
  const k=order[spIdx%order.length];spIdx++;
  const arr=SPEECH[k],txt=arr[Math.floor(Math.random()*arr.length)];
  const el=document.getElementById('c-'+k),b=document.getElementById('b-'+k);
  if(el&&b){b.textContent=txt;el.classList.add('say');setTimeout(()=>el.classList.remove('say'),4400);}
}

async function loadGPF(){
  try{
    const rows=await gviz('1tIGOFFP9Ef8x2RJ4hdLBHPyB2lRW4-H6mtXZNwc9HfM','รวม');
    if(!rows.length)return;
    const cols=Object.keys(rows[0]);
    const planCols=cols.filter(c=>c&&c.indexOf('แผน')===0);
    const last=rows[rows.length-1],prev=rows[rows.length-2]||{};
    const num=v=>parseFloat(String(v==null?'':v).replace(/,/g,''));
    const items=[];
    planCols.forEach(pc=>{
      const v=num(last[pc]); if(!isFinite(v)||!v)return;
      const pv=num(prev[pc]); let cls='tk-eq',ar='–',dl='';
      if(isFinite(pv)&&pv){const d=v-pv;if(d>0.00005){cls='tk-up';ar='▲';}else if(d<-0.00005){cls='tk-dn';ar='▼';}dl=(d>=0?'+':'')+d.toFixed(2);}
      items.push(`<span class="tk-item">${pc.replace('แผน','').trim()} <b>${v.toFixed(4)}</b> <span class="${cls}">${ar}${dl}</span></span>`);
    });
    if(!items.length)return;
    const block=items.join('<span class="tk-sep">•</span>')+'<span class="tk-sep">•</span>';
    document.getElementById('tickerTrack').innerHTML=block+block;   // ซ้ำ 2 ชุด ให้วนต่อเนื่อง (-50%)
    const dc=cols[0]; if(last[dc]){const tag=document.querySelector('.ticker-tag');if(tag)tag.textContent='📈 NAV กบข. '+asDateStr(last[dc]).split('-').reverse().join('/');}
  }catch(e){ console.warn('GPF ticker:',e); const t=document.getElementById('ticker'); if(t)t.style.display='none'; }
}

/* ---- render ---- */
function render(){
  const p=DATA.player;
  if(p.name) document.getElementById('pName').textContent=p.name;
  if(p.email) document.getElementById('pMail').textContent=p.email;
  document.getElementById('lv').textContent=p.level;
  document.getElementById('xpText').textContent=`${p.xp}/${p.xpMax} XP`;
  setTimeout(()=>document.getElementById('xpBar').style.width=(p.xp/p.xpMax*100)+'%',200);
  ['cow','cat','rabbit','panda'].forEach(k=>{
    const d=DATA[k];
    document.getElementById('b-'+k).textContent=d.bubble;
    const m=document.getElementById('m-'+k);
    m.innerHTML=d.stats.slice(0,2).map(s=>`<b>${s[1]}</b>`).join('');
  });
  document.getElementById('upd').textContent=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}

/* ---- panel ---- */
function openPanel(k){
  const d=DATA[k];
  document.getElementById('pHead').style.background=`linear-gradient(135deg,${d.color},${shade(d.color,-18)})`;
  document.getElementById('pHead').innerHTML=
    `<div class="ic">${ICON[k]}</div><div><h2>${d.title}</h2><p>${d.subtitle}</p></div>`;
  let html=
    d.stats.map(s=>`<div class="stat-row"><span class="lbl">${s[0]}</span><span class="val">${s[1]}</span></div>`).join('')
    + `<div class="bar"><i style="width:${d.progress}%;background:linear-gradient(90deg,${d.color},${shade(d.color,-18)})"></i></div>`
    + `<div class="badges">${d.badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div>`;

  // ตารางสอนวันนี้
  if(d.today){
    html+=`<div class="sec-h">🗓️ คาบสอนวันนี้</div>`;
    if(d.today.length){
      html+=`<div class="tt">`+d.today.map(r=>
        `<div class="tt-row${r.status.startsWith('✓')?' done':''}">
           <span class="pd">คาบ ${r.period}</span>
           <span class="tt-main"><b>${r.subject}</b><small>${r.cls} · ${r.time}</small></span>
           <span class="tt-st">${r.status||''}</span>
         </div>`).join('')+`</div>`;
    }else{
      html+=`<div class="quote">วันนี้ไม่มีคาบสอน 🎉</div>`;
    }
  }
  // 🐼 งานส่วนตัว (จากชีต)
  if(d.personal){
    html+=`<div class="sec-h">📝 งานส่วนตัว</div>`;
    if(d.personal.length){
      html+=`<div class="todos">`+d.personal.map(t=>
        `<div class="todo-it ${t.priority}${t.done?' is-done':''}">
           <span class="td-dot"></span>
           <span class="td-tx">${t.done?'<s>':''}${t.text}${t.done?'</s>':''}${t.due?`<small> · ⏰ ${t.due}`:''}${t.due?'</small>':''}</span>
         </div>`).join('')+`</div>`;
    }else{
      html+=`<div class="quote">ยังไม่มีงานส่วนตัว — กด "แก้งานส่วนตัว" เพื่อเพิ่ม</div>`;
    }
  }
  // 📅 ปฏิทินเดือนนี้ (กริด 7 วัน) — วันมีนัดจะมีจุด, วันหยุดสีแดง, วันนี้ไฮไลต์
  if(d.monthCal){
    const mc=d.monthCal;
    html+=`<div class="sec-h">📅 ปฏิทินเดือน ${mc.title} <small>(${mc.eventDays} วันมีนัด)</small></div>`;
    html+=`<div class="mgrid">`+TH_DOW.map(h=>`<div class="mg-h">${h}</div>`).join('');
    html+=mc.cells.map(c=>{
      if(c.blank) return `<div class="mg-c blank"></div>`;
      const has=c.events.length>0, cls=['mg-c'];
      if(c.today)cls.push('today'); if(c.holiday)cls.push('hol'); if(has)cls.push('has');
      const tip=has?c.events.map(e=>e.title+(e.time?' '+e.time+' น.':'')).join('\n').replace(/"/g,'&quot;'):'';
      return `<div class="${cls.join(' ')}"${tip?` title="${tip}"`:''}><span>${c.day}</span>${has?`<span class="mg-dot"></span>`:''}</div>`;
    }).join('')+`</div>`;
    html+=`<div class="mg-cap">🟣 วันมีนัด · 🔴 วันหยุด · <b>แตะวันที่เพื่อดูชื่อกิจกรรม</b></div>`;
  }
  // 📅 ปฏิทินงาน (สัปดาห์นี้ / เดือนนี้ / ถัดไป)
  if(d.calendar){
    const grp=(label,arr)=>{
      if(!arr||!arr.length) return '';
      return `<div class="sec-h">📅 ${label} <small>(${arr.length})</small></div><div class="cal">`+
        arr.map(e=>{
          const dt=new Date(e.date+'T00:00:00');
          const dd=dt.getDate()+' '+['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][dt.getMonth()];
          const inner=`<span class="cal-d ${e.kind}"><b>${dt.getDate()}</b><small>${['อา','จ','อ','พ','พฤ','ศ','ส'][dt.getDay()]}</small></span>
             <span class="cal-main"><b>${e.title}</b><small>${dd}${e.time?' · '+e.time+' น.':e.allDay?' · ทั้งวัน':''}</small></span>`;
          return e.link
            ? `<a class="cal-row" href="${e.link}" target="_blank" rel="noopener">${inner}<span class="cal-go">↗</span></a>`
            : `<div class="cal-row">${inner}</div>`;
        }).join('')+`</div>`;
    };
    const c=d.calendar;
    if((c.week&&c.week.length)||(c.month&&c.month.length)||(c.later&&c.later.length)){
      html+=grp('สัปดาห์นี้',c.week)+grp('เดือนนี้',c.month)+grp('ถัดไป',c.later);
    }else{
      html+=`<div class="sec-h">📅 ปฏิทินงาน</div><div class="quote">ไม่มีนัดหมายที่จะถึง 🎉</div>`;
    }
  }
  // 🐼 เตือนจากระบบ (auto-digest)
  if(d.autoItems&&d.autoItems.length){
    html+=`<div class="sec-h">🔔 เตือนจากระบบ <small>(ดึงอัตโนมัติ)</small></div>`;
    html+=`<div class="proj">`+d.autoItems.map(a=>
      `<div class="proj-row">
         <span class="proj-ic">${a.icon}</span>
         <span class="proj-n" style="font-weight:600">${a.text}</span>
         ${a.url?`<a class="proj-go" style="background:#c9b3ff" href="${a.url}" target="_blank" rel="noopener">ทำ ↗</a>`:''}
       </div>`).join('')+`</div>`;
  }
  // 🐱 รายการโปรเจกต์/เว็บแอป
  if(d.projects&&d.projects.length){
    html+=`<div class="sec-h">🗂️ โปรเจกต์ / เว็บแอป</div>`;
    html+=`<div class="proj">`+d.projects.map(p=>
      `<div class="proj-row">
         <span class="proj-ic">${p.icon}</span>
         <span class="proj-n">${p.name}${p.warning?`<small>⚠️ ${p.warning}</small>`:''}</span>
         ${p.url?`<a class="proj-go" href="${p.url}" target="_blank" rel="noopener">เปิด ↗</a>`:`<span class="proj-dot ${p.ok?'ok':'warn'}"></span>`}
       </div>`).join('')+`</div>`;
  }
  // 🐱 งานค้าง (todos)
  if(d.todos&&d.todos.length){
    html+=`<div class="sec-h">📌 งานค้าง <small>(${d.todos.length} รายการ)</small></div>`;
    html+=`<div class="todos">`+d.todos.map(t=>
      `<div class="todo-it ${t.priority}">
         <span class="td-dot"></span>
         <span class="td-tx"><b>${t.app?t.app+': ':''}</b>${t.text}</span>
       </div>`).join('')+`</div>`;
  }
  // 🐰 ตรวจสุขภาพวันนี้
  if(d.healthToday){
    html+=`<div class="sec-h">🩺 ตรวจสุขภาพวันนี้</div>`;
    if(d.healthToday.length){
      html+=`<div class="tt">`+d.healthToday.map(h=>
        `<div class="tt-row"><span class="pd" style="background:#a0e7a0;color:#1c5a1c">${h.cls}</span>
           <span class="tt-main"><b>${h.stu}</b><small>${h.items.map(i=>i[0]+(String(i[1]).toLowerCase()==='pass'?' ✓':' ✗')).join(' · ')}</small></span></div>`
        ).join('')+`</div>`;
    }else{
      html+=`<div class="quote">วันนี้ยังไม่ได้ตรวจสุขภาพ — เปิดระบบนักเรียนเพื่อบันทึก</div>`;
    }
  }
  // 🐰 ความดีล่าสุด
  if(d.goodDeeds&&d.goodDeeds.length){
    html+=`<div class="sec-h">⭐ ความดีล่าสุด</div>`;
    html+=`<div class="subj">`+d.goodDeeds.map(g=>
      `<div class="subj-row"><span class="subj-n">${g.desc}<small style="color:#a7a4c0"> ${g.cls} · ${g.date}</small></span>
        <span class="subj-v"><b style="color:#27a05a">+${g.pts}</b></span></div>`).join('')+`</div>`;
  }
  // สรุปสอนสะสมรายวิชา
  if(d.bySubject&&d.bySubject.length){
    html+=`<div class="sec-h">📊 สอนสะสมรายวิชา <small>(ตั้งแต่เปิดเทอม 15 พ.ค.)</small></div>`;
    html+=`<div class="subj">`+d.bySubject.map(s=>
      `<div class="subj-row"><span class="subj-n">${s.label}</span>
        <span class="subj-v"><b>${s.taught}</b> คาบ <small>/ ${s.perWeek} ต่อสัปดาห์</small></span></div>`).join('')+`</div>`;
  }
  // ปุ่มลิงก์
  if(d.links&&d.links.length){
    html+=`<div class="acts">`+d.links.map(l=>
      `<a class="act" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('')+`</div>`;
  }
  html+=`<div class="quote">💬 ${d.quote}</div>`;
  document.getElementById('pBody').innerHTML=html;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('panel').classList.add('on');
}
function closePanel(){
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('panel').classList.remove('on');
}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=(n>>16)+p,g=(n>>8&255)+p,b=(n&255)+p;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');}

/* ---- clock ---- */
function tick(){
  const now=new Date();
  document.getElementById('clk').textContent=now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('dte').textContent=now.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'short'});
}

/* ---- detect ว่ามีรูป PNG จริงไหม ถ้ามีให้สลับจาก emoji ---- */
function detectAssets(){
  const map={'c-cow':'assets/cow.png','c-cat':'assets/cat.png','c-rabbit':'assets/rabbit.png','c-panda':'assets/panda.png'};
  Object.entries(map).forEach(([id,src])=>{
    const img=new Image();
    img.onload=()=>document.getElementById(id).classList.add('has-png');
    img.src=src;
  });
  const bg=new Image();
  bg.onload=()=>document.getElementById('stage').classList.add('has-bg');
  bg.src='assets/room.png';
}

render();tick();detectAssets();loadReal();loadGPF();
setInterval(tick,1000*30);
setInterval(loadReal,1000*60*5);   // รีเฟรชข้อมูลจริงทุก 5 นาที
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
// deep-link: #cow/#cat/#rabbit/#panda เปิด panel นั้นเลย (โหลดข้อมูลก่อน)
(function(){const k=location.hash.replace('#','');if(['cow','cat','rabbit','panda'].includes(k))setTimeout(()=>openPanel(k),2600);})();
</script>

<button id="ccBtn" onclick="ccToggle()"><span class="ccdot"></span><span style="font-size:17px">🤖</span><span>Claude Code</span></button>
<div id="ccPanel">
  <div class="cchead" id="ccHead">
    <span class="d"></span><b>🤖 Claude Code</b>
    <span class="sub" id="ccSub">—</span>
    <button class="x" onclick="ccToggle()">×</button>
  </div>
  <div id="ccLog"></div>
  <div class="ccfoot" id="ccFoot"></div>
</div>
<script>
const CCB_REGISTRY='https://script.google.com/macros/s/AKfycbwLOXe-n889nbX47EiQ4RO6ECLz9aohai0uGG1U9eDnuHB4iXDYhVPclZZuxYieAihl5A/exec';
const cc={url:'',at:'',token:localStorage.getItem('ccb_token')||'',busy:false,sid:null,opened:false};
const ccLog=()=>document.getElementById('ccLog');
const ccFoot=()=>document.getElementById('ccFoot');

function ccEsc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function ccMd(s){s=ccEsc(s);s=s.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/^\n/,'')+'</pre>');s=s.replace(/`([^`]+)`/g,'<code>$1</code>');s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');return s;}
function ccAdd(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;ccLog().appendChild(d);ccLog().scrollTop=ccLog().scrollHeight;return d;}
function ccSetOnline(on){document.getElementById('ccBtn').classList.toggle('online',on);document.getElementById('ccHead').classList.toggle('on',on);}

async function ccToggle(){
  const p=document.getElementById('ccPanel');
  p.classList.toggle('show');
  if(p.classList.contains('show')&&!cc.opened){cc.opened=true;await ccRefresh();}
}

async function ccRefresh(){
  document.getElementById('ccSub').textContent='กำลังเชื่อมต่อ…';
  try{
    const r=await fetch(CCB_REGISTRY+'?action=getBridge&t='+Date.now());
    const d=await r.json(); cc.url=(d.url||'').trim(); cc.at=d.updatedAt||'';
  }catch(e){ cc.url=''; }
  // เช็กว่าลิงก์ tunnel ยังมีชีวิตจริง (กันลิงก์เก่าค้างใน gas-api → ERR_NAME_NOT_RESOLVED)
  if(cc.url){
    try{
      const c=new AbortController(); const to=setTimeout(()=>c.abort(),10000);
      await fetch(cc.url+'/health',{signal:c.signal}); clearTimeout(to);  // 200/401 = ยังอยู่, throw = ตาย
    }catch(e){ cc.url=''; }
  }
  if(!cc.url){
    ccSetOnline(false);
    document.getElementById('ccSub').textContent='ออฟไลน์';
    ccLog().innerHTML=''; ccFoot().innerHTML='';
    ccAdd('ccsys','🔌 Claude Code ออฟไลน์อยู่\n\nเปิดในเครื่อง: ดับเบิลคลิก <b>start.bat</b> และ <b>tunnel.bat</b>\nแล้วกดปุ่ม 🔄 ลองใหม่');
    ccFoot().innerHTML='<button onclick="ccRefresh()" style="flex:1">🔄 ลองเชื่อมต่อใหม่</button>';
    return;
  }
  ccSetOnline(true);
  document.getElementById('ccSub').textContent='ออนไลน์'+(cc.at?(' · '+cc.at):'');
  cc.token?ccShowChat():ccShowLogin();
}

function ccShowLogin(){
  ccLog().innerHTML=''; ccAdd('ccsys','🔒 ใส่รหัสผ่านเพื่อเริ่มคุยกับ Claude Code');
  ccFoot().innerHTML='<input id="ccPw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password"><button id="ccLoginBtn">เข้า</button>';
  const pw=document.getElementById('ccPw'),btn=document.getElementById('ccLoginBtn');
  const go=async()=>{
    const v=pw.value.trim(); if(!v)return; btn.disabled=true; btn.textContent='…';
    try{
      const r=await fetch(cc.url+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v})});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d.token){cc.token=d.token;localStorage.setItem('ccb_token',d.token);ccShowChat();return;}
      ccAdd('ccerr',d.error||('ผิดพลาด '+r.status));
    }catch(e){ ccAdd('ccerr','เชื่อมต่อไม่ได้'); }
    btn.disabled=false; btn.textContent='เข้า'; pw.value='';
  };
  btn.onclick=go; pw.onkeydown=e=>{if(e.key==='Enter')go();}; pw.focus();
}

function ccShowChat(){
  ccLog().innerHTML=''; ccAdd('ccsys','คุย/สั่งงาน Claude Code ได้เลย เช่น "แก้เว็บ X" หรือ "clasp push"');
  ccFoot().innerHTML='<textarea id="ccInp" rows="1" placeholder="พิมพ์คำสั่ง… (Enter ส่ง)"></textarea><button id="ccSendBtn">ส่ง</button>';
  const inp=document.getElementById('ccInp'),btn=document.getElementById('ccSendBtn');
  inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ccSend();}});
  btn.onclick=ccSend; inp.focus();
}

async function ccSend(){
  if(cc.busy)return;
  const inp=document.getElementById('ccInp'),btn=document.getElementById('ccSendBtn');
  const msg=inp.value.trim(); if(!msg)return;
  inp.value='';inp.style.height='auto';
  ccAdd('ccm me',ccEsc(msg));
  cc.busy=true;btn.disabled=true;
  let aiBox=null,acc='';
  const ensure=()=>{if(!aiBox)aiBox=ccAdd('ccm ai','');return aiBox;};
  try{
    const res=await fetch(cc.url+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cc.token},body:JSON.stringify({message:msg,sessionId:cc.sid})});
    if(res.status===401){cc.token='';localStorage.removeItem('ccb_token');ccAdd('ccerr','ต้องเข้าสู่ระบบใหม่');ccShowLogin();throw new Error();}
    if(!res.ok){ccAdd('ccerr','error '+res.status);throw new Error();}
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        let ev='message',data='';for(const ln of chunk.split('\n')){if(ln.startsWith('event:'))ev=ln.slice(6).trim();else if(ln.startsWith('data:'))data+=ln.slice(5).trim();}
        if(!data)continue;let d;try{d=JSON.parse(data);}catch{continue;}
        if(ev==='session'&&d.sessionId)cc.sid=d.sessionId;
        else if(ev==='text'){acc+=d.text;ensure().innerHTML=ccMd(acc);ccLog().scrollTop=ccLog().scrollHeight;}
        else if(ev==='tool'){ccAdd('cctool','🔧 '+ccEsc(d.name));aiBox=null;acc='';}
        else if(ev==='result'){if(d.isError)ccAdd('ccerr',ccEsc(d.text||''));else if(d.text&&!acc)ensure().innerHTML=ccMd(d.text);}
        else if(ev==='error')ccAdd('ccerr',ccEsc(d.message||'error'));
      }
    }
  }catch(e){if(e.message)ccAdd('ccerr','ขัดข้อง: '+ccEsc(e.message));}
  cc.busy=false;if(btn)btn.disabled=false;const i2=document.getElementById('ccInp');if(i2)i2.focus();
}
</script>
