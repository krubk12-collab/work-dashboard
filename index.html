<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ห้องทำงานครูบีเค 🎮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2d2a4a; --gold:#ffcf5c; --gold-d:#f5a623;
    --card:rgba(255,255,255,.86); --shadow:0 10px 30px rgba(45,42,74,.18);
    --cow:#7cc4ff; --cat:#ff9eb5; --rabbit:#a0e7a0; --panda:#c9b3ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Mali',system-ui,sans-serif;color:var(--ink);
    overflow-x:hidden;background:#0e1430;
  }

  /* ===== STAGE: ห้องทำงาน 16:9 ===== */
  .stage{
    position:relative;width:100%;max-width:1600px;margin:0 auto;
    aspect-ratio:16/9;min-height:100vh;
    /* พื้นหลัง placeholder วาดด้วย CSS — จะถูกแทนด้วยรูป Canva ทีหลัง */
    background:
      radial-gradient(120% 80% at 50% -10%, #fff3d6 0%, transparent 55%),
      linear-gradient(180deg,#ffe9c7 0%,#ffd9a8 38%,#f6b27a 38%,#e89a63 100%);
    overflow:hidden;
  }
  /* ถ้ามีรูป assets/room.png จะใช้รูปแทน gradient */
  .stage.has-bg{background-image:url('assets/room.png');background-size:cover;background-position:center}
  /* มีรูปห้องจริงแล้ว -> ซ่อนของแต่งห้องที่วาดด้วย CSS */
  .stage.has-bg .deco{display:none}
  /* ของแต่งห้อง (placeholder) */
  .deco{position:absolute;opacity:.85;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
  .window{left:6%;top:10%;width:22%;height:34%;background:linear-gradient(180deg,#bfe9ff,#8fd0ff);border:10px solid #fff;border-radius:14px;box-shadow:inset 0 0 0 3px #cfa46a,var(--shadow)}
  .window::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 45%,rgba(255,255,255,.6) 50%,transparent 55%)}
  .plant{right:7%;top:18%;width:90px;height:120px;background:radial-gradient(circle at 50% 30%,#7fd17f,#3fa05a);border-radius:50% 50% 12px 12px}
  .plant::after{content:"";position:absolute;left:30%;bottom:-2px;width:40%;height:34px;background:#d98b5f;border-radius:6px}
  .desk{left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#caa06a,#a9824f)}

  /* ===== HEADER / โปรไฟล์ผู้เล่น ===== */
  .hud{
    position:absolute;left:3%;top:4%;z-index:6;
    display:flex;gap:14px;align-items:center;
    background:var(--card);backdrop-filter:blur(8px);
    padding:12px 18px;border-radius:18px;box-shadow:var(--shadow);
  }
  .avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;
    background:linear-gradient(135deg,var(--gold),var(--gold-d));box-shadow:0 4px 10px rgba(245,166,35,.5)}
  .hud-info h1{font-size:17px;font-weight:700;line-height:1.1}
  .hud-info .lv{font-size:12px;color:#6b6890;font-weight:600}
  .xp{margin-top:5px;width:200px;height:12px;background:#eceaf6;border-radius:8px;overflow:hidden}
  .xp>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf5c,#f5a623);border-radius:8px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
  .clock{position:absolute;right:3%;top:4%;z-index:6;background:var(--card);backdrop-filter:blur(8px);
    padding:10px 16px;border-radius:16px;box-shadow:var(--shadow);text-align:right}
  .clock .t{font-size:20px;font-weight:700;letter-spacing:1px}
  .clock .d{font-size:12px;color:#6b6890;font-weight:600}

  /* ===== ตัวละคร ===== */
  .char{position:absolute;z-index:5;cursor:pointer;width:clamp(110px,13vw,190px);
    transition:transform .25s ease;animation:float 3.2s ease-in-out infinite;
    text-align:center;filter:drop-shadow(0 12px 14px rgba(0,0,0,.22))}
  .char:nth-child(2){animation-delay:.4s}
  .char:nth-child(3){animation-delay:.8s}
  .char:nth-child(4){animation-delay:1.2s}
  .char:hover{transform:translateY(-10px) scale(1.05);animation-play-state:paused}
  .char .body{font-size:clamp(64px,8vw,110px);line-height:1;user-select:none}
  /* ถ้ามีไฟล์ PNG จะแสดงรูปแทน emoji */
  .char img{width:100%;display:none}
  .char.has-png .body{display:none}
  .char.has-png img{display:block}

  /* ป้ายชื่อ + การ์ดสถิติลอย */
  .tag{display:inline-block;margin-top:2px;padding:3px 12px;border-radius:999px;
    font-size:13px;font-weight:700;color:#fff;box-shadow:var(--shadow)}
  .bubble{position:absolute;bottom:78%;left:50%;transform:translateX(-50%);
    background:var(--card);backdrop-filter:blur(8px);padding:8px 14px;border-radius:14px;
    box-shadow:var(--shadow);white-space:nowrap;font-weight:700;font-size:14px;
    opacity:0;transition:.3s;pointer-events:none}
  .bubble::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    border:8px solid transparent;border-top-color:var(--card);border-bottom:0}
  .char:hover .bubble{opacity:1;bottom:84%}
  .mini{display:flex;gap:6px;justify-content:center;margin-top:6px}
  .mini b{font-size:11px;background:rgba(255,255,255,.9);padding:2px 8px;border-radius:8px;box-shadow:var(--shadow)}

  /* ตำแหน่งตัวละคร */
  #c-cow{left:8%;bottom:20%}
  #c-cat{left:32%;bottom:14%}
  #c-rabbit{right:30%;bottom:16%}
  #c-panda{right:7%;bottom:21%}
  #c-cow .tag{background:var(--cow)} #c-cat .tag{background:var(--cat)}
  #c-rabbit .tag{background:var(--rabbit);color:#1c5a1c} #c-panda .tag{background:var(--panda)}

  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  /* ไฟ LIVE เมื่อต่อข้อมูลจริงสำเร็จ */
  .char.live .tag::after{content:"●";margin-left:5px;color:#27d367;font-size:9px;vertical-align:middle;
    animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ===== PANEL รายละเอียด (เปิดเมื่อคลิกตัวละคร) ===== */
  .scrim{position:fixed;inset:0;background:rgba(20,16,40,.5);backdrop-filter:blur(3px);
    z-index:20;opacity:0;pointer-events:none;transition:.25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .panel{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);
    width:min(92vw,460px);max-height:84vh;overflow:auto;background:#fff;border-radius:24px;
    box-shadow:0 30px 60px rgba(20,16,40,.4);opacity:0;pointer-events:none;transition:.3s}
  .panel.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .panel .head{padding:22px 24px;color:#fff;display:flex;align-items:center;gap:14px}
  .panel .head .ic{font-size:46px}
  .panel .head h2{font-size:20px}
  .panel .head p{font-size:13px;opacity:.9;font-weight:500}
  .panel .x{position:absolute;right:16px;top:16px;width:34px;height:34px;border:0;border-radius:50%;
    background:rgba(255,255,255,.25);color:#fff;font-size:18px;cursor:pointer}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid #f0eef7}
  .stat-row .lbl{font-weight:600;color:#4a4770}
  .stat-row .val{font-weight:700;font-size:18px;color:var(--ink)}
  .bar{height:10px;background:#eceaf6;border-radius:6px;overflow:hidden;margin:0 24px 14px}
  .bar>i{display:block;height:100%;border-radius:6px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;padding:16px 24px}
  .badge{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:#fff7e3;color:#b9821a;border:1.5px solid #ffe2a3}
  .quote{padding:16px 24px;font-size:14px;color:#6b6890;background:#faf9ff;font-weight:600}
  .sec-h{padding:16px 24px 8px;font-size:14px;font-weight:700;color:#4a4770}
  .sec-h small{font-weight:500;color:#9a97b5;font-size:11px}
  /* ตารางวันนี้ */
  .tt{padding:0 16px 6px}
  .tt-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px}
  .tt-row:nth-child(odd){background:#f7f6fd}
  .tt-row.done{background:#eafaf0}
  .tt-row .pd{flex:0 0 auto;font-size:11px;font-weight:700;color:#fff;background:#7cc4ff;padding:4px 8px;border-radius:8px}
  .tt-main{flex:1;display:flex;flex-direction:column;line-height:1.25}
  .tt-main b{font-size:13.5px;color:#2d2a4a}
  .tt-main small{font-size:11px;color:#8b88a8}
  .tt-st{flex:0 0 auto;font-size:11px;font-weight:700;color:#27a05a}
  /* สรุปรายวิชา */
  .subj{padding:0 24px 8px}
  .subj-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #eceaf6}
  .subj-row:last-child{border-bottom:0}
  .subj-n{font-size:13px;font-weight:600;color:#4a4770}
  .subj-v{font-size:13px;color:#2d2a4a;white-space:nowrap}
  .subj-v small{color:#a7a4c0;font-size:11px;font-weight:500}
  /* ปุ่มลิงก์ */
  .acts{display:flex;gap:10px;padding:14px 24px 4px}
  .act{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:13.5px;
    padding:12px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#7cc4ff,#4aa3f0);
    box-shadow:0 6px 14px rgba(74,163,240,.35);transition:transform .15s}
  .act:nth-child(2){background:linear-gradient(135deg,#ffcf5c,#f5a623);box-shadow:0 6px 14px rgba(245,166,35,.35)}
  .act:active{transform:scale(.97)}

  .footer{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;
    font-size:11px;color:rgba(45,42,74,.55);font-weight:600}

  @media(max-width:680px){
    .stage{aspect-ratio:auto;min-height:100vh}
    .xp{width:130px}
    .char{width:90px}
    #c-cow{left:2%;bottom:30%} #c-cat{left:26%;bottom:8%}
    #c-rabbit{right:26%;bottom:10%} #c-panda{right:2%;bottom:31%}
    .clock{padding:8px 12px}.clock .t{font-size:16px}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <!-- ของแต่งห้อง (placeholder จนกว่าจะมีรูป Canva) -->
  <div class="deco desk"></div>
  <div class="deco window"></div>
  <div class="deco plant"></div>

  <!-- HUD ผู้เล่น -->
  <div class="hud">
    <div class="avatar">🧑‍🏫</div>
    <div class="hud-info">
      <h1>ครูบีเค</h1>
      <div class="lv">Lv. <span id="lv">1</span> · <span id="xpText">0/100 XP</span></div>
      <div class="xp"><i id="xpBar"></i></div>
    </div>
  </div>
  <div class="clock">
    <div class="t" id="clk">--:--</div>
    <div class="d" id="dte">—</div>
  </div>

  <!-- ตัวละคร 4 ตัว -->
  <div class="char" id="c-cow" onclick="openPanel('cow')">
    <div class="bubble" id="b-cow"></div>
    <div class="body">🐮</div><img src="assets/cow.png" alt="โควัว">
    <div class="tag">งานสอน</div>
    <div class="mini" id="m-cow"></div>
  </div>
  <div class="char" id="c-cat" onclick="openPanel('cat')">
    <div class="bubble" id="b-cat"></div>
    <div class="body">🐱</div><img src="assets/cat.png" alt="แมว">
    <div class="tag">เว็บ/โปรเจกต์</div>
    <div class="mini" id="m-cat"></div>
  </div>
  <div class="char" id="c-rabbit" onclick="openPanel('rabbit')">
    <div class="bubble" id="b-rabbit"></div>
    <div class="body">🐰</div><img src="assets/rabbit.png" alt="กระต่าย">
    <div class="tag">งานนักเรียน</div>
    <div class="mini" id="m-rabbit"></div>
  </div>
  <div class="char" id="c-panda" onclick="openPanel('panda')">
    <div class="bubble" id="b-panda"></div>
    <div class="body">🐼</div><img src="assets/panda.png" alt="แพนด้า">
    <div class="tag">งานส่วนตัว</div>
    <div class="mini" id="m-panda"></div>
  </div>

  <div class="footer">ห้องทำงานครูบีเค · อัปเดต <span id="upd">—</span></div>
</div>

<!-- Panel -->
<div class="scrim" id="scrim" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <button class="x" onclick="closePanel()">✕</button>
  <div class="head" id="pHead"></div>
  <div id="pBody"></div>
</div>

<script>
/* =========================================================
   DATA — ตอนนี้เป็นข้อมูลจำลอง (mock)
   ภายหลังจะแทนด้วย:  DATA = await (await fetch(GAS_URL)).json()
   ========================================================= */
const COLORS={cow:'#7cc4ff',cat:'#ff9eb5',rabbit:'#a0e7a0',panda:'#c9b3ff'};
const ICON={cow:'🐮',cat:'🐱',rabbit:'🐰',panda:'🐼'};

const DATA={
  player:{name:'ครูบีเค',level:7,xp:340,xpMax:500},
  cow:{ title:'งานสอน', subtitle:'บันทึกการเข้าสอน',
    bubble:'วันนี้สอนแล้ว 3 คาบ!', color:'#7cc4ff',
    stats:[['คาบที่สอนวันนี้','3 / 5'],['สัปดาห์นี้','18 คาบ'],['บันทึกครบ','92%']],
    progress:92, badges:['🔥 สอนต่อเนื่อง 5 วัน','📋 บันทึกครบเดือน'],
    quote:'ขยันสอนสุดๆ เลยครู ไปต่ออีกนิดเดียว!' },
  cat:{ title:'งานเว็บ/โปรเจกต์', subtitle:'เว็บแอปโรงเรียน',
    bubble:'มี 2 โปรเจกต์รอ deploy', color:'#ff9eb5',
    stats:[['โปรเจกต์ทั้งหมด','9'],['กำลังทำ','3'],['รอ deploy','2']],
    progress:66, badges:['🚀 deploy 5 ระบบ','🐛 แก้บั๊กครบ'],
    quote:'อย่าลืม deploy ระบบของหาย กับ timetable นะเหมียว~' },
  rabbit:{ title:'งานนักเรียน', subtitle:'ดูแลนักเรียน',
    bubble:'ตรวจสุขภาพ 28/30 คน', color:'#a0e7a0',
    stats:[['นักเรียนทั้งหมด','30'],['ตรวจสุขภาพวันนี้','28'],['เยี่ยมบ้าน','12/30']],
    progress:80, badges:['❤️ เยี่ยมบ้านครบ 12','🦷 ตรวจสุขภาพ'],
    quote:'เหลืออีก 2 คนตรวจสุขภาพ เกือบครบแล้วน้า!' },
  panda:{ title:'งานส่วนตัว', subtitle:'To-do วันนี้',
    bubble:'เหลือ 2 งานวันนี้', color:'#c9b3ff',
    stats:[['งานวันนี้','5'],['เสร็จแล้ว','3'],['ค้าง','2']],
    progress:60, badges:['🎯 plan my day','☕ พักดื่มกาแฟ'],
    quote:'ค่อยๆ ทำนะ พักได้ก็พัก เดี๋ยวงานก็เสร็จเอง 🎍' }
};

/* =========================================================
   โหลดข้อมูลจริงจาก Google Sheets ผ่าน gviz (JSONP — ไม่ติด CORS)
   ========================================================= */
const CFG={
  scheduleId:'14ZyWxubxyrpJN3GGN8YE8llP6ynZHHMOHyzrh3v6sng',
  teachingLogId:'1qff81PoB2ZEPZr-PwyRj8TM0EF72GbLXDuwTiXXBSPI',
  subjectsId:'1BYF9tLnaBX9IHXafD32i1s21NOlnYQKPgIrXoLI8asU',
  teacherId:'T013',   // ครูบีเค (ณัฐธเนศ อ้นจีน)
  termStart:'2026-05-15',                          // เปิดเทอม 15 พ.ค. 2569
  logUrl:'https://script.google.com/macros/s/AKfycbwR_jmt3cY2cobLlbmn0BgXSaTaKrj4TIVe0z72yr1t6abHZWBNIG1xkTwIoNnnj2rs/exec',
  scheduleUrl:'https://sites.google.com/view/bklive/'
};
const CLASS_MAP={C17:'ม.1/1',C18:'ม.1/2',C19:'ม.2/1',C20:'ม.2/2',C21:'ม.3/1',C22:'ม.3/2'};
const DOW_TH=['','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์','อาทิตย์'];

// โหลดชีตเป็น array ของ object (key = ชื่อคอลัมน์แถวแรก)
function gviz(sheetId){
  return new Promise((resolve,reject)=>{
    const cb='gviz_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const to=setTimeout(()=>{cleanup();reject('timeout');},12000);
    function cleanup(){clearTimeout(to);delete window[cb];s.remove();}
    window[cb]=(resp)=>{
      try{
        const t=resp.table, cols=t.cols.map(c=>(c.label||c.id||'').trim());
        const rows=t.rows.map(r=>{const o={};(r.c||[]).forEach((cell,i)=>{o[cols[i]]=cell?cell.v:null;});return o;});
        cleanup();resolve(rows);
      }catch(err){cleanup();reject(err);}
    };
    s.onerror=()=>{cleanup();reject('script error');};
    s.src=`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${cb};out:json&headers=1`;
    document.body.appendChild(s);
  });
}

function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function asDateStr(v){
  if(v==null) return '';
  if(v instanceof Date) return fmtDate(v);
  const s=String(v);
  const m=s.match(/^Date\((\d+),(\d+),(\d+)/);   // gviz date type
  if(m) return fmtDate(new Date(+m[1],+m[2],+m[3]));
  return s.slice(0,10);
}
function mondayOf(d){const x=new Date(d);const dow=x.getDay();x.setDate(x.getDate()+(dow===0?-6:1-dow));x.setHours(0,0,0,0);return x;}
// gviz เก็บเวลาเป็น Date(1899,11,30,HH,MM,SS) -> แปลงเป็น "HH:MM"
function asTimeStr(v){
  if(v==null) return '';
  const s=String(v);
  let m=s.match(/^Date\(\d+,\d+,\d+,(\d+),(\d+)/);
  if(m) return m[1].padStart(2,'0')+':'+m[2].padStart(2,'0');
  m=s.match(/(\d{1,2}):(\d{2})/);
  if(m) return m[1].padStart(2,'0')+':'+m[2];
  return s;
}

// คำนวณการ์ด 🐮 งานสอน + XP จาก Schedule + TeachingLog + Subjects
function computeTeaching(schedule,logs,subjects){
  const now=new Date(), todayStr=fmtDate(now);
  const schedDow=(now.getDay()===0?7:now.getDay());   // 1=จ..7=อา
  const monday=mondayOf(now), ym=todayStr.slice(0,7);

  // map subject_id -> {name, level}
  const subjMap={};
  subjects.forEach(r=>{subjMap[String(r.subject_id).trim()]={name:r.subject_name,level:r.level};});
  const subjLabel=sid=>{const s=subjMap[sid];return s?(s.name+(s.level?' '+s.level:'')):sid;};
  const className=cid=>CLASS_MAP[cid]||cid;

  const sched=schedule.filter(r=>String(r.teacher_id).trim()===CFG.teacherId && String(r.is_active).toUpperCase()==='TRUE');
  const weekScheduled=sched.length;
  const todaySched=sched.filter(r=>Number(r.day_of_week)===schedDow)
                        .sort((a,b)=>Number(a.period)-Number(b.period));
  const todayScheduled=todaySched.length;

  // index Schedule: class|dow|period -> subject_id (ไว้ join กับ log)
  const schedIdx={};
  sched.forEach(r=>{schedIdx[String(r.class_id).trim()+'|'+Number(r.day_of_week)+'|'+Number(r.period)]=String(r.subject_id).trim();});

  const mine=logs.filter(r=>String(r.teacher_id).trim()===CFG.teacherId);
  const todayLogs=mine.filter(r=>asDateStr(r.date)===todayStr);
  const todayTaught=todayLogs.filter(r=>r.status==='taught').length;
  const todayRecorded=todayLogs.length;

  // สถานะที่บันทึกของแต่ละคาบวันนี้ (ไว้โชว์ในตาราง)
  const todayStatus={};
  todayLogs.forEach(r=>{todayStatus[String(r.class_id).trim()+'|'+Number(r.period)]=r.status;});

  let weekTaught=0,monthRecorded=0,totalTaught=0;
  const bySubjCount={};                              // subject_id -> คาบที่สอนแล้ว (ตั้งแต่เปิดเทอม)
  mine.forEach(r=>{
    const ds=asDateStr(r.date); if(!ds) return;
    const d=new Date(ds+'T00:00:00');
    if(r.status==='taught'){
      totalTaught++; if(d>=monday) weekTaught++;
      if(ds>=CFG.termStart){
        const dow=(d.getDay()===0?7:d.getDay());
        const sid=schedIdx[String(r.class_id).trim()+'|'+dow+'|'+Number(r.period)];
        if(sid) bySubjCount[sid]=(bySubjCount[sid]||0)+1;
      }
    }
    if(ds.slice(0,7)===ym) monthRecorded++;
  });
  const recordPct=todayScheduled?Math.round(todayRecorded/todayScheduled*100):0;

  // ตารางวันนี้ (วิชา/คาบ/เวลา/ห้อง/สถานะ)
  const ST_TH={taught:'✓ สอนแล้ว',sick:'ลาป่วย',personal:'ลากิจ',training:'อบรม',substitute:'มีครูแทน',activity:'กิจกรรม',no_class:'ไม่มีสอน'};
  const today=todaySched.map(r=>{
    const cid=String(r.class_id).trim(), p=Number(r.period);
    const st=todayStatus[cid+'|'+p];
    return {period:p,time:asTimeStr(r.start_time)+'–'+asTimeStr(r.end_time),
            subject:subjLabel(String(r.subject_id).trim()),cls:className(cid),
            status:st?ST_TH[st]||st:''};
  });

  // สรุปสอนสะสมรายวิชา (วิชาที่สอนทั้งหมด + จำนวนคาบที่สอนแล้ว) เรียงมาก→น้อย
  const distinctSubj={};
  sched.forEach(r=>{const sid=String(r.subject_id).trim();distinctSubj[sid]=(distinctSubj[sid]||0)+1;});
  const bySubject=Object.keys(distinctSubj).map(sid=>({
    label:subjLabel(sid),taught:bySubjCount[sid]||0,perWeek:distinctSubj[sid]
  })).sort((a,b)=>b.taught-a.taught || b.perWeek-a.perWeek);

  let bubble;
  if(todayScheduled===0) bubble='วันนี้ไม่มีคาบสอน พักได้~';
  else if(todayRecorded>=todayScheduled) bubble='บันทึกครบทุกคาบแล้ว เก่งมาก!';
  else if(todayTaught>0) bubble='วันนี้สอนแล้ว '+todayTaught+' คาบ!';
  else bubble='วันนี้มี '+todayScheduled+' คาบ อย่าลืมบันทึกนะ';

  const badges=[];
  if(weekScheduled) badges.push('📚 '+weekScheduled+' คาบ/สัปดาห์');
  if(totalTaught>0) badges.push('🎓 สอนสะสม '+totalTaught+' คาบ');
  if(weekTaught>=10) badges.push('🔥 สัปดาห์นี้ '+weekTaught+' คาบ');
  if(recordPct===100&&todayScheduled) badges.push('✅ บันทึกครบวันนี้');
  if(!badges.length) badges.push('🌱 เริ่มบันทึกการสอนกันเถอะ');

  return {
    card:{title:'งานสอน',subtitle:'วันนี้วัน'+DOW_TH[schedDow]+' · '+todayScheduled+' คาบ',
      bubble,color:'#7cc4ff',
      stats:[['คาบที่สอนวันนี้',todayTaught+' / '+todayScheduled],
             ['สัปดาห์นี้ (สอนแล้ว)',weekTaught+' คาบ'],
             ['สอนสะสมทั้งเทอม',totalTaught+' คาบ'],
             ['บันทึกครบวันนี้',recordPct+'%']],
      progress:recordPct,badges,
      today,bySubject,
      links:[{label:'📝 บันทึกการสอน',url:CFG.logUrl},{label:'📅 ดูตารางสอน',url:CFG.scheduleUrl}],
      quote:todayScheduled?'ขยันสอนสุดๆ เลยครู ไปต่ออีกนิดเดียว!':'วันว่างก็พักผ่อนบ้างนะครู ☕'},
    xp:totalTaught*10
  };
}

async function loadReal(){
  try{
    const [schedule,logs,subjects]=await Promise.all([gviz(CFG.scheduleId),gviz(CFG.teachingLogId),gviz(CFG.subjectsId)]);
    const t=computeTeaching(schedule,logs,subjects);
    DATA.cow=t.card;
    const per=500, lvl=Math.floor(t.xp/per)+1;
    DATA.player={name:'ครูบีเค',level:lvl,xp:t.xp%per,xpMax:per};
    render();
    document.getElementById('c-cow').classList.add('live');
  }catch(err){
    console.warn('โหลดข้อมูลจริงไม่สำเร็จ ใช้ข้อมูลจำลองแทน:',err);
  }
}

/* ---- render ---- */
function render(){
  const p=DATA.player;
  document.getElementById('lv').textContent=p.level;
  document.getElementById('xpText').textContent=`${p.xp}/${p.xpMax} XP`;
  setTimeout(()=>document.getElementById('xpBar').style.width=(p.xp/p.xpMax*100)+'%',200);
  ['cow','cat','rabbit','panda'].forEach(k=>{
    const d=DATA[k];
    document.getElementById('b-'+k).textContent=d.bubble;
    const m=document.getElementById('m-'+k);
    m.innerHTML=d.stats.slice(0,2).map(s=>`<b>${s[1]}</b>`).join('');
  });
  document.getElementById('upd').textContent=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}

/* ---- panel ---- */
function openPanel(k){
  const d=DATA[k];
  document.getElementById('pHead').style.background=`linear-gradient(135deg,${d.color},${shade(d.color,-18)})`;
  document.getElementById('pHead').innerHTML=
    `<div class="ic">${ICON[k]}</div><div><h2>${d.title}</h2><p>${d.subtitle}</p></div>`;
  let html=
    d.stats.map(s=>`<div class="stat-row"><span class="lbl">${s[0]}</span><span class="val">${s[1]}</span></div>`).join('')
    + `<div class="bar"><i style="width:${d.progress}%;background:linear-gradient(90deg,${d.color},${shade(d.color,-18)})"></i></div>`
    + `<div class="badges">${d.badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div>`;

  // ตารางสอนวันนี้
  if(d.today){
    html+=`<div class="sec-h">🗓️ คาบสอนวันนี้</div>`;
    if(d.today.length){
      html+=`<div class="tt">`+d.today.map(r=>
        `<div class="tt-row${r.status.startsWith('✓')?' done':''}">
           <span class="pd">คาบ ${r.period}</span>
           <span class="tt-main"><b>${r.subject}</b><small>${r.cls} · ${r.time}</small></span>
           <span class="tt-st">${r.status||''}</span>
         </div>`).join('')+`</div>`;
    }else{
      html+=`<div class="quote">วันนี้ไม่มีคาบสอน 🎉</div>`;
    }
  }
  // สรุปสอนสะสมรายวิชา
  if(d.bySubject&&d.bySubject.length){
    html+=`<div class="sec-h">📊 สอนสะสมรายวิชา <small>(ตั้งแต่เปิดเทอม 15 พ.ค.)</small></div>`;
    html+=`<div class="subj">`+d.bySubject.map(s=>
      `<div class="subj-row"><span class="subj-n">${s.label}</span>
        <span class="subj-v"><b>${s.taught}</b> คาบ <small>/ ${s.perWeek} ต่อสัปดาห์</small></span></div>`).join('')+`</div>`;
  }
  // ปุ่มลิงก์
  if(d.links&&d.links.length){
    html+=`<div class="acts">`+d.links.map(l=>
      `<a class="act" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('')+`</div>`;
  }
  html+=`<div class="quote">💬 ${d.quote}</div>`;
  document.getElementById('pBody').innerHTML=html;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('panel').classList.add('on');
}
function closePanel(){
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('panel').classList.remove('on');
}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=(n>>16)+p,g=(n>>8&255)+p,b=(n&255)+p;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');}

/* ---- clock ---- */
function tick(){
  const now=new Date();
  document.getElementById('clk').textContent=now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('dte').textContent=now.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'short'});
}

/* ---- detect ว่ามีรูป PNG จริงไหม ถ้ามีให้สลับจาก emoji ---- */
function detectAssets(){
  const map={'c-cow':'assets/cow.png','c-cat':'assets/cat.png','c-rabbit':'assets/rabbit.png','c-panda':'assets/panda.png'};
  Object.entries(map).forEach(([id,src])=>{
    const img=new Image();
    img.onload=()=>document.getElementById(id).classList.add('has-png');
    img.src=src;
  });
  const bg=new Image();
  bg.onload=()=>document.getElementById('stage').classList.add('has-bg');
  bg.src='assets/room.png';
}

render();tick();detectAssets();loadReal();
setInterval(tick,1000*30);
setInterval(loadReal,1000*60*5);   // รีเฟรชข้อมูลจริงทุก 5 นาที
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
</script>
