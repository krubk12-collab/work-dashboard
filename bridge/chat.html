<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💬 คุยกับ Claude Code</title>
<style>
  :root{ --bg:#0f1117; --panel:#171a23; --panel2:#1e222e; --line:#2a2f3c;
         --me:#2563eb; --txt:#e6e8ee; --dim:#8b93a7; --accent:#7c5cff; --tool:#243046; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Sarabun","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100dvh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .dot{width:10px;height:10px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84}
  header .dot.off{background:#e0566a;box-shadow:0 0 8px #e0566a}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sub{font-size:12px;color:var(--dim);margin-left:auto;text-align:right;line-height:1.3}
  #log{flex:1;overflow-y:auto;padding:18px 14px 8px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  .msg.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.ai code{background:#0c0e14;padding:1px 5px;border-radius:5px;font-size:13px}
  .msg.ai pre{background:#0c0e14;padding:10px;border-radius:8px;overflow-x:auto;font-size:13px}
  .tool{align-self:flex-start;font-size:12.5px;color:var(--dim);background:var(--tool);border:1px solid var(--line);border-radius:10px;padding:5px 10px;display:flex;gap:7px;align-items:center;max-width:88%}
  .tool b{color:#9db4ff;font-weight:600}
  .tool .in{color:#7e889e;font-family:ui-monospace,Consolas,monospace;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sys{align-self:center;font-size:12px;color:var(--dim)}
  .err{align-self:center;color:#ff8aa0;font-size:13px;background:#2a1620;border:1px solid #50212e;padding:8px 12px;border-radius:10px;max-width:88%}
  footer{padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
  .row{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;font-size:14.5px;max-height:160px;outline:none}
  textarea:focus{border-color:var(--accent)}
  button.send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 18px;height:44px;font-weight:700;cursor:pointer;font-size:15px}
  button.send:disabled{opacity:.5;cursor:default}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--dim)}
  .bar button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:3px 9px;cursor:pointer;font:inherit;font-size:12px}
  .bar button:hover{color:var(--txt);border-color:var(--accent)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>🤖 Claude Code</h1>
  <div class="sub" id="sub">กำลังเชื่อมต่อ…</div>
</header>

<div id="log">
  <div class="sys">เริ่มคุยกับ Claude Code ในเครื่องได้เลย — สั่งแก้เว็บแอป, รัน clasp, ถามโค้ด ฯลฯ</div>
</div>

<footer>
  <div class="bar">
    <span id="state">พร้อม</span>
    <button onclick="newChat()" style="margin-left:auto">+ แชทใหม่</button>
  </div>
  <div class="row">
    <textarea id="inp" rows="1" placeholder="พิมพ์คำสั่ง… (Enter ส่ง / Shift+Enter ขึ้นบรรทัด)"></textarea>
    <button class="send" id="sendBtn" onclick="send()">ส่ง</button>
  </div>
</footer>

<script>
const TOKEN = '__BRIDGE_TOKEN__';
let sessionId = sessionStorage.getItem('ccb_sid') || null;
let busy = false;
const log = document.getElementById('log');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('sendBtn');

// เช็คสถานะ bridge
fetch('/health').then(r=>r.json()).then(h=>{
  document.getElementById('dot').classList.remove('off');
  document.getElementById('sub').innerHTML = h.workdir.split(/[\\/]/).pop() + ' · ' + h.model;
}).catch(()=>{
  document.getElementById('dot').classList.add('off');
  document.getElementById('sub').textContent = 'เชื่อมต่อไม่ได้';
});

function add(cls, html){
  const d = document.createElement('div');
  d.className = cls;
  d.innerHTML = html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
// markdown เบาๆ: code block, inline code, **bold**
function md(s){
  s = esc(s);
  s = s.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/^\n/,'')+'</pre>');
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  return s;
}

inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,160)+'px';});
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey){e.preventDefault();send();}
});

function newChat(){
  sessionId=null; sessionStorage.removeItem('ccb_sid');
  add('sys','— เริ่มแชทใหม่ (ล้างความจำของ Claude) —');
}

async function send(){
  if(busy) return;
  const msg = inp.value.trim();
  if(!msg) return;
  inp.value=''; inp.style.height='auto';
  add('msg me', esc(msg));
  busy=true; sendBtn.disabled=true;
  document.getElementById('state').innerHTML='<span class="spin"></span> กำลังคิด…';

  let aiBox=null;
  let acc='';
  const ensureAi=()=>{ if(!aiBox) aiBox=add('msg ai',''); return aiBox; };

  try{
    const res = await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
      body: JSON.stringify({message:msg, sessionId})
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); add('err', e.error||('error '+res.status)); throw new Error(); }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf='';
    while(true){
      const {value,done} = await reader.read();
      if(done) break;
      buf += dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const chunk = buf.slice(0,idx); buf=buf.slice(idx+2);
        const ev = parseSSE(chunk);
        if(!ev) continue;
        handle(ev);
      }
    }
  }catch(err){
    if(err.message) add('err','เกิดข้อผิดพลาด: '+esc(err.message));
  }finally{
    busy=false; sendBtn.disabled=false;
    document.getElementById('state').textContent='พร้อม';
    inp.focus();
  }

  function parseSSE(chunk){
    let event='message', data='';
    for(const line of chunk.split('\n')){
      if(line.startsWith('event:')) event=line.slice(6).trim();
      else if(line.startsWith('data:')) data+=line.slice(5).trim();
    }
    if(!data) return null;
    try{ return {event, data:JSON.parse(data)}; }catch{ return null; }
  }

  function handle(ev){
    const d=ev.data;
    switch(ev.event){
      case 'session':
        if(d.sessionId){ sessionId=d.sessionId; sessionStorage.setItem('ccb_sid',sessionId); }
        break;
      case 'text':
        acc += d.text;
        ensureAi().innerHTML = md(acc);
        log.scrollTop=log.scrollHeight;
        break;
      case 'tool':
        add('tool','🔧 <b>'+esc(d.name)+'</b> <span class="in">'+esc(d.input||'')+'</span>');
        aiBox=null; acc=''; // ข้อความ AI ถัดไปแยกกล่องใหม่
        break;
      case 'result':
        if(d.isError) add('err','Claude แจ้ง error: '+esc(d.text||''));
        else if(d.text && !acc) ensureAi().innerHTML=md(d.text);
        break;
      case 'error':
        add('err', esc(d.message||'error'));
        break;
    }
  }
}
inp.focus();
</script>
</body>
</html>
